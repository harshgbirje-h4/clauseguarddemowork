<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClauseGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="top">
    <div class="brand"><i></i>ClauseGuard</div>
    <div class="top-r">
      <span id="api-mode" class="conn">MOCK/DEV</span>
    </div>
  </header>

  <main>
    <!-- Target Website Header -->
    <div class="site">
      <span class="lbl">Website:</span>
      <span id="site-name">Loading...</span>
    </div>

    <!-- Analyze Button -->
    <button id="analyze-btn" class="btn">Analyze Policy</button>
    <p class="hint" id="analyze-hint">Scans page text and evaluates privacy exposure.</p>

    <!-- Status / Notification Banner -->
    <div id="status" class="status hidden" role="status" aria-live="polite"></div>

    <!-- Analysis Results Section -->
    <div id="results" class="hidden">
      
      <!-- Score & Gauge Card -->
      <div class="card score">
        <div class="score-head">
          <div>
            <b id="risk-score">0.0</b>
            <span>risk score</span>
          </div>
          <span id="risk-band" class="band Low">Low</span>
        </div>
        <div class="gauge"><i id="gauge-fill" style="width: 0%;"></i></div>
        <div class="meta-row">
          <span>Mode: <b id="mode-text">MOCK/DEV</b></span>
          <span>Clauses: <b id="clause-count">0</b></span>
        </div>
      </div>

      <!-- Detected Entities Section -->
      <div class="card section-card">
        <h3>Detected Data Types</h3>
        <div id="entities-list" class="chips">
          <span class="chip">None detected</span>
        </div>
      </div>

      <!-- Extracted Clauses Section -->
      <div class="card section-card">
        <div class="clauses-head">
          <h3>Riskiest Clauses</h3>
          <button id="toggle-clauses-btn" class="btn-link">View Details</button>
        </div>
        <div id="clauses-details" class="hidden">
          <!-- Clause cards injected here -->
        </div>
      </div>

      <!-- Quick Comparison Card -->
      <div class="card compare" id="compare-section" style="display: none;">
        <h3>Compare with Saved Service</h3>
        <div class="row">
          <select id="compare-target" class="select-field">
            <option value="">-- Select website --</option>
          </select>
          <button id="compare-btn" class="btn small">Compare</button>
        </div>
        <div id="compare-results" class="hidden"></div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="save-btn" class="btn">Add to Portfolio</button>
      </div>
      <div id="save-status" class="status hidden" role="status"></div>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
